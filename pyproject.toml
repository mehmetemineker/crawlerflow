[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlerflow"
version = "0.1.0"
description = "Declarative YAML workflow engine for browser automation and web scraping"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehmet Emin Eker" }]
keywords = [
    "automation",
    "browser",
    "crawler",
    "scraping",
    "workflow",
    "yaml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["pydoll-python>=2.23,<3"]
dev = [
    "pydoll-python>=2.23,<3",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
crawlerflow = "crawlerflow.cli.app:app"

[project.urls]
Homepage = "https://github.com/mehmetemineker/crawlerflow"
Repository = "https://github.com/mehmetemineker/crawlerflow"
Issues = "https://github.com/mehmetemineker/crawlerflow/issues"
Documentation = "https://github.com/mehmetemineker/crawlerflow/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["crawlerflow"]

[tool.hatch.build.targets.sdist]
include = [
    "/crawlerflow",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
