[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlerflow"
version = "0.1.0"
description = "Declarative YAML workflow engine for browser automation and web scraping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = ["pydoll-python>=2.23,<3"]
dev = [
    "pydoll-python>=2.23,<3",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
crawlerflow = "crawlerflow.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["crawlerflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
