site_name: Crawlerflow
site_description: Declarative YAML workflow engine for browser automation and web scraping
site_url: https://mehmetemineker.github.io/crawlerflow/
repo_url: https://github.com/mehmetemineker/crawlerflow
repo_name: mehmetemineker/crawlerflow
edit_uri: edit/main/docs/
copyright: Copyright &copy; Mehmet Emin Eker

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Workflow authoring:
      - Control flow: control-flow.md
      - Runtime variables: runtime-variables.md
      - HTML output: html-output.md
      - HTTP requests: http-requests.md
      - Retries and logging: retries-and-logging.md
  - Extending:
      - Architecture: architecture.md
      - Plugins: plugins.md
      - Pydoll adapter: pydoll.md
  - Decisions:
      - ADR 0001 - Core boundaries: adr/0001-core-boundaries.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mehmetemineker/crawlerflow
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/crawlerflow/
