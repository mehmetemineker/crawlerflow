[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlerflow-capsolver"
version = "0.1.0"
description = "CapSolver plugin for Crawlerflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawlerflow>=0.2.0",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.entry-points."crawlerflow.plugins"]
capsolver = "crawlerflow_capsolver:CapSolverPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlerflow_capsolver"]
